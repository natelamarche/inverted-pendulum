[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "inverted-pendulum"
version = "0.1.0"
description = "Simulation and reinforcement learning control of a rotary inverted pendulum"
requires-python = ">=3.12,<3.14"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "PyYAML",

    "gymnasium",
    "stable-baselines3",
    "torch",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E","F","B","UP"]